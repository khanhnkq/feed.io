name: Publish Docker Images

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      build_optional_images:
        description: "Also build standalone web & garage-init images"
        required: false
        default: "false"
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      # ------------------------------------------------------------------------
      # 1. Backend Image (dùng chung cho API, Worker, Migrate)
      # ------------------------------------------------------------------------
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # 2. Web Frontend Image (Optional - Frontend runs on Vercel in prod/demo)
      # ------------------------------------------------------------------------
      - name: Extract metadata for Web
        if: github.event.inputs.build_optional_images == 'true'
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push Web Image
        if: github.event.inputs.build_optional_images == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '' }}
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # 3. Garage Init Image (Optional - Storage runs on Appwrite Cloud)
      # ------------------------------------------------------------------------
      - name: Extract metadata for Garage Init
        if: github.event.inputs.build_optional_images == 'true'
        id: meta-garage-init
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}-garage-init
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push Garage Init Image
        if: github.event.inputs.build_optional_images == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./infra/garage
          file: ./infra/garage/Dockerfile.init
          push: true
          tags: ${{ steps.meta-garage-init.outputs.tags }}
          labels: ${{ steps.meta-garage-init.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 4. Tự động SSH vào VPS và Deploy (Zero-Downtime Rolling Update)
  # --------------------------------------------------------------------------
  deploy-vps:
    name: Deploy to Production VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "==> Pulling latest code and pre-built Docker images on VPS..."
            cd /opt/feedio
            git fetch origin main
            git reset --hard origin/main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f infra/compose/compose.prod.yaml --env-file .env.production pull
            echo "==> Running database migrations..."
            docker compose -f infra/compose/compose.prod.yaml --env-file .env.production run --rm migrate
            echo "==> Starting updated containers..."
            docker compose -f infra/compose/compose.prod.yaml --env-file .env.production up -d --remove-orphans
            echo "==> Purging all RabbitMQ containers, volumes, images & host storage..."
            docker ps -aq --filter "name=rabbitmq" | xargs -r docker rm -f || true
            docker volume ls -q | grep -i "rabbitmq" | xargs -r docker volume rm -f || true
            docker images --format "{{.Repository}}:{{.Tag}}" | grep -i "^rabbitmq:" | xargs -r docker rmi -f || true
            rm -rf /var/lib/feedio/rabbitmq 2>/dev/null || sudo -n rm -rf /var/lib/feedio/rabbitmq 2>/dev/null || true
            echo "==> Cleaning up unused images..."
            docker system prune -f --volumes=false
            echo "==> Verifying RabbitMQ storage removal & VPS resources..."
            echo "Remaining rabbitmq volumes: $(docker volume ls -q | grep -i rabbitmq | wc -l)"
            echo "Remaining rabbitmq images: $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -i '^rabbitmq:' | wc -l)"
            sleep 3
            docker compose -f infra/compose/compose.prod.yaml --env-file .env.production ps
            free -h
            df -h /
            docker stats --no-stream


