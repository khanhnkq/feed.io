name: verify

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: cd apps/backend && uv sync --frozen --all-groups
      - run: make verify
