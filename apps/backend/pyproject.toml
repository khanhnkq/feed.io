[project]
name = "feedio-backend"
version = "0.1.0"
description = "Feed.io modular monolith API and workers"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=9.5,<10",
  "alembic>=1.16,<2",
  "fastapi[standard]>=0.116,<1",
  "greenlet>=3.2,<4",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "prometheus-client>=0.22,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pyjwt[crypto]>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "redis[hiredis]>=6.4,<7",
  "sqlmodel>=0.0.24,<0.1",
  "starlette>=1.3.1,<2",
  "structlog>=25.4,<26",
  "pwdlib[argon2]>=0.3,<1",
  "aiosmtplib>=5,<6",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "import-linter>=2.3,<3",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedio"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a migrated local PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["feedio"]

[tool.importlinter]
root_packages = ["feedio"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Project domain is framework independent"
type = "forbidden"
source_modules = ["feedio.modules.projects.domain"]
forbidden_modules = ["fastapi", "sqlmodel", "sqlalchemy", "pydantic"]

[[tool.importlinter.contracts]]
name = "Project application does not depend on infrastructure or presentation"
type = "forbidden"
source_modules = ["feedio.modules.projects.application"]
forbidden_modules = [
  "feedio.modules.projects.infrastructure",
  "feedio.modules.projects.presentation",
]

[[tool.importlinter.contracts]]
name = "Identity and organization domains are framework independent"
type = "forbidden"
source_modules = [
  "feedio.modules.identity.domain",
  "feedio.modules.organizations.domain",
]
forbidden_modules = ["fastapi", "sqlmodel", "sqlalchemy", "pydantic"]

[[tool.importlinter.contracts]]
name = "Identity and organization applications avoid adapters"
type = "forbidden"
source_modules = [
  "feedio.modules.identity.application",
  "feedio.modules.organizations.application",
]
forbidden_modules = [
  "feedio.modules.identity.infrastructure",
  "feedio.modules.identity.presentation",
  "feedio.modules.organizations.infrastructure",
  "feedio.modules.organizations.presentation",
]
