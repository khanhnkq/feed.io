name: feedio

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedio}
      POSTGRES_DB: ${POSTGRES_DB:-feedio}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedio} -d ${POSTGRES_DB:-feedio}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: ["valkey-data:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-feedio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-feedio}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.1.0
    environment:
      GARAGE_DB_ENGINE: sqlite
      GARAGE_METADATA_DIR: /var/lib/garage/meta
      GARAGE_DATA_DIR: /var/lib/garage/data
      GARAGE_REPLICATION_FACTOR: "1"
      GARAGE_RPC_BIND_ADDR: "[::]:3901"
      GARAGE_RPC_PUBLIC_ADDR: 127.0.0.1:3901
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_S3_API_BIND_ADDR: "[::]:3900"
      GARAGE_S3_API_REGION: garage
      GARAGE_ADMIN_API_BIND_ADDR: "[::]:3903"
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-development-admin-token}
    ports: ["3900:3900", "3903:3903"]
    volumes: ["garage-meta:/var/lib/garage/meta", "garage-data:/var/lib/garage/data"]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-feedio}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-feedio}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports: ["8080:8080", "9000:9000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  api:
    build:
      context: ../../apps/backend
    environment:
      FEEDIO_DATABASE_URL: postgresql+psycopg://feedio:feedio@postgres:5432/feedio
      FEEDIO_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8088"]'
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8088
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  nginx:
    image: nginx:1.29.1-alpine
    ports: ["8088:80"]
    volumes:
      - ../nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
  rabbitmq-data:
  garage-meta:
  garage-data:
  nginx-cache:
