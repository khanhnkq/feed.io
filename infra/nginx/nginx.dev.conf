events { worker_connections 1024; }

http {
  upstream feedio_web { server web:3000; }
  upstream feedio_api { server api:8000; }

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media_cache:10m max_size=1g inactive=1h;

  server {
    listen 80;
    client_max_body_size 2m;

    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location /api/ {
      proxy_pass http://feedio_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://feedio_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
