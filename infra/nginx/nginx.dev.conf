events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Upstreams
  upstream feedio_web {
    server web:3000;
  }
  upstream feedio_api {
    server api:8000;
  }

  # Connection Upgrade Map for WebSockets
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Caching
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media_cache:10m max_size=1g inactive=1h;

  # Edge Rate Limiting Zones
  limit_req_zone $binary_remote_addr zone=edge_api_limit:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=edge_auth_limit:10m rate=20r/m;
  limit_req_status 429;

  # Gzip Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

  server {
    listen 80;

    # 1GB Upload limit for media collaboration
    client_max_body_size 1g;
    client_body_buffer_size 256k;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Health Check Endpoint
    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # Custom 429 Error Handler (JSON output)
    error_page 429 @rate_limited;
    location @rate_limited {
      default_type application/json;
      return 429 '{"type":"https://feed.io/errors/rate-limit-exceeded","title":"Rate Limit Exceeded","status":429,"detail":"Edge Gateway rate limit exceeded. Please retry later.","code":"RATE_LIMIT_EXCEEDED"}';
    }

    # Dedicated WebSocket Route
    location /api/v1/events/ws {
      proxy_pass http://feedio_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Auth Endpoints (Strict Edge Rate Limiting)
    location /api/v1/auth/ {
      limit_req zone=edge_auth_limit burst=10 nodelay;
      proxy_pass http://feedio_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Media Upload Endpoints (Streaming direct upload, no disk buffering)
    location ~* ^/api/v1/(media|profiles/.*/avatar) {
      limit_req zone=edge_api_limit burst=50 nodelay;
      proxy_pass http://feedio_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    # General API Routes
    location /api/ {
      limit_req zone=edge_api_limit burst=50 nodelay;
      proxy_pass http://feedio_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Frontend Web Routes (Next.js)
    location / {
      proxy_pass http://feedio_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
