global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: feedio-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: feedio-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
